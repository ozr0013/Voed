<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 2 70 84" fill="none">
  <!-- waveform accent nestled in the top of the V -->
  <g fill="#17150f">
    <rect x="39.5" y="16" width="2.7" height="8"  rx="1.35"/>
    <rect x="44"   y="12" width="2.7" height="16" rx="1.35"/>
    <rect x="48.5" y="8"  width="2.7" height="24" rx="1.35"/>
    <rect x="53"   y="6"  width="2.7" height="28" rx="1.35"/>
    <rect x="57.5" y="8"  width="2.7" height="24" rx="1.35"/>
    <rect x="62"   y="12" width="2.7" height="16" rx="1.35"/>
    <rect x="66.5" y="16" width="2.7" height="8"  rx="1.35"/>
  </g>

  <!-- left arm: solid orange -->
  <path d="M30 26 L48 76" stroke="#ef5a24" stroke-width="16" stroke-linecap="round"/>

  <!-- right arm: black filmstrip, taller -->
  <g transform="translate(48 76) rotate(28)">
    <rect x="-9" y="-62" width="18" height="62" rx="8.5" fill="#17150f"/>
    <!-- film frames -->
    <rect x="-5" y="-56" width="10" height="10" rx="2.2" fill="#e7e4dc"/>
    <rect x="-5" y="-40" width="10" height="10" rx="2.2" fill="#e7e4dc"/>
    <rect x="-5" y="-24" width="10" height="10" rx="2.2" fill="#e7e4dc"/>
    <!-- sprocket holes down the edge -->
    <g fill="#e7e4dc">
      <rect x="-7.9" y="-57" width="2" height="2" rx="0.5"/>
      <rect x="-7.9" y="-49" width="2" height="2" rx="0.5"/>
      <rect x="-7.9" y="-41" width="2" height="2" rx="0.5"/>
      <rect x="-7.9" y="-33" width="2" height="2" rx="0.5"/>
      <rect x="-7.9" y="-25" width="2" height="2" rx="0.5"/>
      <rect x="-7.9" y="-17" width="2" height="2" rx="0.5"/>
      <rect x="-7.9" y="-9"  width="2" height="2" rx="0.5"/>
    </g>
  </g>
</svg>
